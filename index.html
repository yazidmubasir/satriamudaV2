<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SATRIA Builder</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4fff8;font-family:Inter,system-ui}.app{min-height:100vh}.hero{background:linear-gradient(135deg,#0b3d2e,#2e7d32);color:#fff}.card{border:0;box-shadow:0 8px 25px #1232}.sidebar{min-height:100vh;background:#0b3d2e;color:#fff}.nav-btn{width:100%;text-align:left;border:0;background:transparent;color:#d8efe0;padding:10px 14px;border-radius:10px}.nav-btn:hover,.nav-btn.active{background:#ffffff18;color:#fff}.small-help{font-size:.78rem;color:#6c757d}.table thead th{white-space:nowrap}.hidden{display:none!important}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const $=id=>document.getElementById(id), state={token:sessionStorage.getItem('sb_token')||'',user:null,view:'dashboard',selectedClass:'',selectedTable:''};
function gas(fn,...a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))[fn](...a))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function login(){document.body.innerHTML='<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card p-4"><h2>SATRIA Builder</h2><p class="text-muted">Web-App Builder Multi-Kelas</p><form id="lf"><input id="lu" class="form-control mb-2" placeholder="Username" required><input id="lp" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-success w-100">Masuk</button></form><button class="btn btn-link w-100" id="bbo">Bootstrap Owner</button></div></div></div></div>';bbo.onclick=bootstrapForm;lf.onsubmit=async e=>{e.preventDefault();try{const x=await gas('login',lu.value,lp.value);if(x.needsBootstrap)return bootstrapForm();state.token=x.token;state.user=x.user;sessionStorage.setItem('sb_token',state.token);renderApp()}catch(e){alert(e.message)}}}
function bootstrapForm(){document.body.innerHTML='<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card p-4"><h3>Bootstrap Owner</h3><p class="small-help">Gunakan Spreadsheet MASTER kosong. Sistem membuat semua MASTER_* secara otomatis.</p><form id="bf"><input id="mid" class="form-control mb-2" placeholder="MASTER Spreadsheet ID" required><input id="on" class="form-control mb-2" placeholder="Username owner" required><input id="op" type="password" class="form-control mb-2" placeholder="Password owner" minlength="4" required><input id="nm" class="form-control mb-3" placeholder="Nama owner"><button class="btn btn-success w-100">Bootstrap</button></form><button class="btn btn-link w-100" onclick="login()">Kembali</button></div></div></div></div>';bf.onsubmit=async e=>{e.preventDefault();try{await gas('bootstrapOwner',{masterSpreadsheetId:mid.value,username:on.value,password:op.value,nama:nm.value});alert('Bootstrap berhasil. Silakan login.');login();}catch(e){alert(e.message)}}}
function renderApp(){document.body.innerHTML='<div class="app"><div class="row g-0"><aside class="col-lg-2 sidebar p-3"><h4 class="mb-4">SATRIA Builder</h4><div id="nav"></div><button id="logout" class="btn btn-outline-light w-100 mt-4">Keluar</button></aside><main class="col-lg-10"><div class="hero p-4"><h3 class="m-0">Halo, '+esc(state.user.nama||state.user.username)+'</h3><small>'+esc(state.user.role)+'</small></div><div id="content" class="p-4"></div></main></div></div>';logout.onclick=async()=>{try{await gas('logout',state.token)}finally{sessionStorage.removeItem('sb_token');location.reload()}};buildNav();loadDashboard()}
function buildNav(){let x='<button class="nav-btn" onclick="loadDashboard()">Dashboard</button>';if(state.user.role==='owner')x+='<button class="nav-btn" onclick="loadMaster(\'MASTER_USERS\')">Master Users</button><button class="nav-btn" onclick="loadMaster(\'MASTER_GURU\')">Master Guru</button><button class="nav-btn" onclick="loadMaster(\'MASTER_KARYAWAN\')">Master Karyawan</button><button class="nav-btn" onclick="loadMaster(\'MASTER_KELAS\')">Master Kelas</button><button class="nav-btn" onclick="loadMaster(\'MASTER_MAPEL\')">Master Mapel</button><button class="nav-btn" onclick="loadMenus()">Menu Builder</button><button class="nav-btn" onclick="loadModules()">Modul Kegiatan</button><button class="nav-btn" onclick="loadAggregate()">Akumulasi Kelas</button>';else x+='<button class="nav-btn" onclick="loadClassConfig()">Kelas Saya</button><button class="nav-btn" onclick="loadUsersClass()">Siswa</button><button class="nav-btn" onclick="loadModules()">Modul</button>';nav.innerHTML=x}
async function loadDashboard(){const d=await gas('api',state.token,'dashboard',{});content.innerHTML='<div class="row g-3"><div class="col-md-4"><div class="card p-4"><div class="text-muted">Role</div><h3>'+esc(d.role)+'</h3></div></div><div class="col-md-4"><div class="card p-4"><div class="text-muted">Kelas</div><h3>'+esc(d.classes??d.className??'-')+'</h3></div></div><div class="col-md-4"><div class="card p-4"><div class="text-muted">Spreadsheet</div><h6>'+esc(d.spreadsheetId||'MASTER')+'</h6></div></div></div>'}
const MASTER_FIELDS={MASTER_GURU:['nip','nama','email','status'],MASTER_KARYAWAN:['nip','nama','email','status'],MASTER_KELAS:['kode_kelas','nama_kelas','spreadsheet_id','admin_username','status'],MASTER_MAPEL:['kode_mapel','nama_mapel','kelompok','status'],MASTER_MENU:['nama_menu','judul','icon','sort_order','roles','module_id','sheet_name','description','status'],MASTER_MODUL:['kode_modul','nama_kegiatan','description','sheet_name','headers_json','roles','status']};
async function loadMaster(table){state.selectedTable=table;const d=await gas('api',state.token,'masters',{table});if(table==='MASTER_USERS')return loadUsersMaster(d);content.innerHTML='<div class="d-flex justify-content-between align-items-center mb-3"><h4>'+table+'</h4><button class="btn btn-success" onclick="masterForm()">Tambah</button></div><div class="card p-3"><div class="table-responsive"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(String(r[h]??''))+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary" onclick=masterForm('+JSON.stringify(r).replaceAll('"','&quot;')+')>Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="masterDel(\''+esc(r[d.headers[0]])+'\')">Hapus</button></td></tr>').join('')+'</tbody></table></div></div>'}
async function loadUsersMaster(d){state.userRefs=await gas('api',state.token,'userRefs',{});content.innerHTML='<div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-1">MASTER USERS</h4><div class="small-help">Guru/karyawan/admin kelas harus terhubung ke MASTER_GURU, MASTER_KARYAWAN dan MASTER_KELAS. Nama, email, NIP/NISN dan spreadsheet ditentukan otomatis.</div></div><button class="btn btn-success" onclick="masterForm()">Tambah User</button></div><div class="card p-3"><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Username</th><th>Nama</th><th>Email</th><th>Role</th><th>Referensi</th><th>Kelas</th><th>Spreadsheet</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+d.rows.map(r=>'<tr><td>'+esc(r.username)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.email||'')+'</td><td>'+esc(r.role)+'</td><td>'+esc(r.id_ref||'')+'<div class="small-help">'+esc(r.nip_nisn||'')+'</div></td><td>'+esc(r.id_kelas||'-')+'</td><td class="small">'+esc(r.spreadsheet_id||'-')+'</td><td>'+esc(r.status)+'</td><td><button class="btn btn-sm btn-outline-secondary" onclick=masterForm('+JSON.stringify(r).replaceAll('"','&quot;')+')>Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="masterDel(\''+esc(r.id_user)+'\')">Hapus</button></td></tr>').join('')+'</tbody></table></div></div>'}
function userOptionText(x,type){return type==='kelas'?((x.kode_kelas||'')+' — '+(x.nama_kelas||'')+(x.spreadsheet_id?'':' — Spreadsheet belum diatur')):((x.nip||'')+' — '+(x.nama||''))}
function masterForm(row={}){if(state.selectedTable==='MASTER_USERS')return userForm(row);const h=MASTER_FIELDS[state.selectedTable]||[];let html='<div class="modal fade" id="m"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5>Form '+state.selectedTable+'</h5></div><div class="modal-body">'+h.map(k=>'<label class="form-label small">'+k+'</label><input class="form-control mb-2" data-k="'+k+'" value="'+esc(row[k]??'')+'">').join('')+'<div class="small-help">Password yang dikirim akan diubah ke SHA-256 di server; plaintext tidak disimpan.</div></div><div class="modal-footer"><button class="btn btn-success" onclick="saveMasterForm()">Simpan</button></div></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);new bootstrap.Modal(m).show();window._edit=row}
function userForm(row={}){const refs=state.userRefs||{guru:[],karyawan:[],kelas:[]},role=String(row.role||'guru');let refHtml='',classHtml='';if(role==='guru'||role==='karyawan'||role==='admin_kelas'){const typ=role==='guru'?'guru':'karyawan',items=refs[typ]||[];refHtml='<label class="form-label">Sumber Identitas</label><select id="usr_ref" class="form-select"><option value="">Pilih '+typ.replace(/^./,m=>m.toUpperCase())+'</option>'+items.map(x=>'<option value="'+esc(x[typ==='guru'?'id_guru':'id_karyawan'])+'">'+esc(userOptionText(x,typ))+'</option>').join('')+'</select><div class="small-help mt-1">Identitas diambil otomatis dari MASTER_'+typ.toUpperCase()+'.</div>'}else refHtml='<label class="form-label">Nama Owner</label><input id="usr_owner_name" class="form-control" value="'+esc(row.nama||'Owner')+'">';if(role==='admin_kelas')classHtml='<label class="form-label">Kelas</label><select id="usr_class" class="form-select"><option value="">Pilih Kelas</option>'+refs.kelas.map(x=>'<option value="'+esc(x.id_kelas)+'">'+esc(userOptionText(x,'kelas'))+'</option>').join('')+'</select><div class="small-help mt-1">Spreadsheet ID otomatis mengikuti MASTER_KELAS.</div>';content.innerHTML='<div class="modal fade" id="m"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5>'+(row.id_user?'Edit':'Tambah')+' User</h5></div><div class="modal-body"><div class="row g-3"><div class="col-md-4"><label class="form-label">Username</label><input id="usr_username" class="form-control" value="'+esc(row.username||'')+'"></div><div class="col-md-4"><label class="form-label">Role</label><select id="usr_role" class="form-select" onchange="changeUserRole('+JSON.stringify(row).replace(/'/g,'&#39;')+')"><option value="owner">owner</option><option value="guru">guru</option><option value="karyawan">karyawan</option><option value="admin_kelas">admin_kelas</option></select></div><div class="col-md-4"><label class="form-label">Password '+(row.id_user?'(kosong = tetap)':'')+'</label><input id="usr_password" type="password" class="form-control" autocomplete="new-password"></div><div class="col-md-6" id="usr_ref_wrap">'+refHtml+'</div><div class="col-md-6" id="usr_class_wrap">'+classHtml+'</div><div class="col-md-4"><label class="form-label">Status</label><select id="usr_status" class="form-select"><option>ACTIVE</option><option>INACTIVE</option></select></div></div><div class="alert alert-light border mt-3 small" id="usr_info"></div></div><div class="modal-footer"><button class="btn btn-success" onclick="saveUserForm()">Simpan User</button></div></div></div></div>';document.body.insertAdjacentHTML('beforeend',html);new bootstrap.Modal(m).show();window._edit=row;usr_role.value=role;usr_status.value=row.status||'ACTIVE';if((role==='guru'||role==='karyawan'||role==='admin_kelas')&&usr_ref)usr_ref.value=row.id_ref||'';if(role==='admin_kelas'&&usr_class)usr_class.value=row.id_kelas||'';setUserInfo(role)}
function changeUserRole(row){const r={...row,role:$('usr_role').value};const modal=bootstrap.Modal.getInstance(m);modal.hide();m.remove();userForm(r)}
function setUserInfo(role){const el=$('usr_info');if(!el)return;if(role==='guru')el.innerHTML='Pilih guru dari MASTER_GURU. Nama, email dan NIP diambil otomatis; kelas/spreadsheet tidak diisi.';else if(role==='karyawan')el.innerHTML='Pilih karyawan dari MASTER_KARYAWAN. Nama, email dan NIP diambil otomatis.';else if(role==='admin_kelas')el.innerHTML='Pilih karyawan + kelas. Spreadsheet ID diambil otomatis dari MASTER_KELAS dan admin_username kelas akan disinkronkan.';else el.innerHTML='Owner adalah akun global dan tidak terikat ke kelas.'}
async function saveUserForm(){const row=window._edit||{},role=$('usr_role').value,item={id_user:row.id_user||'',username:$('usr_username').value.trim(),role,status:$('usr_status').value,password:$('usr_password').value};if(role==='owner'){item.nama=$('usr_owner_name')?$('usr_owner_name').value.trim():row.nama||'Owner';item.email=row.email||''}else{item.id_ref=$('usr_ref')?$('usr_ref').value:'';if(role==='admin_kelas')item.id_kelas=$('usr_class')?$('usr_class').value:''}try{await gas('api',state.token,'masterSave',{table:'MASTER_USERS',item});bootstrap.Modal.getInstance(m).hide();m.remove();await loadMaster('MASTER_USERS')}catch(e){alert(e.message)}}
async function saveMasterForm(){const item={...(window._edit||{})};document.querySelectorAll('#m [data-k]').forEach(x=>item[x.dataset.k]=x.value);try{await gas('api',state.token,'masterSave',{table:state.selectedTable,item});bootstrap.Modal.getInstance(m).hide();m.remove();loadMaster(state.selectedTable)}catch(e){alert(e.message)}}
async function masterDel(id){if(!confirm('Hapus data?'))return;try{await gas('api',state.token,'masterDelete',{table:state.selectedTable,id});loadMaster(state.selectedTable)}catch(e){alert(e.message)}}
async function loadMenus(){state.selectedTable='MASTER_MENU';const d=await gas('api',state.token,'menuList',{});content.innerHTML='<div class="d-flex justify-content-between align-items-center mb-3"><h4>Menu Builder</h4><button class="btn btn-success" onclick="masterForm()">Tambah Menu</button></div><div class="card p-3"><div class="small-help mb-2">Menu dibuat owner melalui MASTER_MENU.</div><div class="table-responsive"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(String(r[h]??''))+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary" onclick=masterForm('+JSON.stringify(r).replaceAll('"','&quot;')+')>Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}
async function loadModules(){const d=await gas('api',state.token,'moduleList',{});content.innerHTML='<div class="row g-3">'+d.rows.map(r=>'<div class="col-md-6"><div class="card p-4"><h5>'+esc(r.nama_kegiatan)+'</h5><p>'+esc(r.description)+'</p><div class="small"><b>Sheet:</b> '+esc(r.sheet_name)+'</div><div class="small mt-2">Header: '+esc(r.headers_json)+'</div>'+(state.user.role==='admin_kelas'?'<button class="btn btn-success btn-sm mt-3" onclick="activate(\''+esc(r.id_modul)+'\')">Aktifkan</button>':'')+'</div></div>').join('')+'</div>'}
async function activate(id){try{await gas('api',state.token,'activateModule',{classId:state.user.id_kelas,moduleId:id});alert('Aktivasi berhasil jika sheet modul sudah dibuat.')}catch(e){alert(e.message)}}
async function loadAggregate(){const d=await gas('api',state.token,'classAggregate',{});content.innerHTML='<div class="card p-4"><h4>Akumulasi Spreadsheet Kelas</h4><div class="table-responsive"><table class="table"><thead><tr><th>Kelas</th><th>Spreadsheet ID</th><th>Sheet</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.nama_kelas)+'</td><td>'+esc(x.spreadsheet_id||x.error||'')+'</td><td>'+esc((x.sheets||[]).map(s=>s.name).join(', '))+'</td></tr>').join('')+'</tbody></table></div></div>'}
async function loadClassConfig(){const d=await gas('api',state.token,'classConfig',{classId:state.user.id_kelas});content.innerHTML='<div class="card p-4"><h4>'+esc(d.class.nama_kelas)+'</h4><div class="small-help mb-3">Spreadsheet ID: '+esc(d.class.spreadsheet_id)+'</div><div class="input-group mb-3"><input id="sn" class="form-control" placeholder="Nama sheet"><button class="btn btn-success" onclick="newClassSheet()">Tambah Sheet</button></div><div class="list-group">'+d.sheets.map(n=>'<button class="list-group-item list-group-item-action" onclick="viewSheet(\''+esc(n).replace(/'/g,'\\\'')+'\')">'+esc(n)+'</button>').join('')+'</div></div>'}
async function newClassSheet(){const n=$('sn').value.trim();if(!n)return;try{await gas('api',state.token,'createSheet',{classId:state.user.id_kelas,sheetName:n,headers:['timestamp']});loadClassConfig()}catch(e){alert(e.message)}}
async function viewSheet(n){const d=await gas('api',state.token,'classConfig',{classId:state.user.id_kelas}),h=await gas('api',state.token,'sheetHeaders',{spreadsheetId:d.class.spreadsheet_id,sheetName:n});content.innerHTML='<div class="card p-4"><h4>'+esc(n)+'</h4><div class="small-help">Header satu per baris. Header baru ditambahkan tanpa menghapus header lama.</div><textarea id="hh" class="form-control mt-2" rows="10">'+esc(h.headers.join('\n'))+'</textarea><button class="btn btn-success mt-3" onclick="saveCols(\''+esc(d.class.spreadsheet_id)+'\',\''+esc(n)+'\')">Simpan / Tambah Kolom</button></div>'}
async function saveCols(ssid,n){const a=$('hh').value.split(/\n/).map(x=>x.trim()).filter(Boolean);try{await gas('api',state.token,'addColumns',{spreadsheetId:ssid,sheetName:n,headers:a});viewSheet(n)}catch(e){alert(e.message)}}
async function loadUsersClass(){const d=await gas('api',state.token,'readClassTable',{classId:state.user.id_kelas,sheetName:'SISWA'}).catch(()=>({headers:[],rows:[]}));content.innerHTML='<div class="card p-4"><h4>Siswa</h4><div class="small-help mb-3">CRUD siswa dilakukan admin kelas pada spreadsheet kelas.</div><button class="btn btn-success mb-3" onclick="addStudent()">Tambah Siswa</button><div class="table-responsive"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(String(r[h]??''))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
function addStudent(){const username=prompt('Username siswa');if(!username)return;const password=prompt('Password siswa');const nisn=prompt('NISN');const nama=prompt('Nama siswa');gas('api',state.token,'userSave',{item:{username,password,nisn,nama,id_kelas:state.user.id_kelas}}).then(loadUsersClass).catch(e=>alert(e.message))}
(async()=>{try{if(state.token){const x=await gas('session',state.token);state.user=x.user;renderApp();return}}catch(e){sessionStorage.removeItem('sb_token');state.token=''}login()})();</script></body></html>
