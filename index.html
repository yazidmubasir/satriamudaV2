<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>SATRIA Builder V2</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4fff8}.sidebar{min-height:100vh;background:#0b3d2e;color:#fff}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:#dff4e7;padding:.6rem .8rem;border-radius:.6rem}.navbtn:hover{background:#ffffff20}.hero{background:linear-gradient(135deg,#0b3d2e,#2e7d32);color:#fff}.card{border:0;box-shadow:0 8px 24px #1232}.small{font-size:.8rem}.table th{white-space:nowrap}.hidden{display:none}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const S={token:sessionStorage.getItem('sbv2_token')||'',user:null};const $=id=>document.getElementById(id);function call(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)))[fn](...a))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){try{if(S.token){const x=await call('session',S.token);S.user=x.user;return app()}}catch(e){sessionStorage.removeItem('sbv2_token');S.token=''}login()}
function login(){document.body.innerHTML='<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card p-4"><h2>SATRIA Builder V2</h2><p class="text-muted">Web-App Builder Multi-Kelas</p><form id="lf"><input id="u" class="form-control mb-2" placeholder="Username" required><input id="p" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-success w-100">Masuk</button></form><button class="btn btn-link w-100" onclick="bootstrapForm()">Bootstrap Owner</button></div></div></div></div>';lf.onsubmit=async e=>{e.preventDefault();try{const x=await call('login',u.value,p.value);if(x.needsBootstrap)return bootstrapForm();S.token=x.token;S.user=x.user;sessionStorage.setItem('sbv2_token',S.token);app()}catch(e){alert(e.message)}}}
function bootstrapForm(){document.body.innerHTML='<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card p-4"><h3>Bootstrap Owner</h3><p class="small text-muted">Gunakan Spreadsheet MASTER kosong. Sistem akan membuat MASTER_USERS, MASTER_GURU, MASTER_KARYAWAN, MASTER_KELAS, MASTER_MAPEL, MASTER_MENU, MASTER_MODUL, MASTER_PERMISSION.</p><form id="bf"><input id="mid" class="form-control mb-2" placeholder="MASTER Spreadsheet ID" required><input id="ou" class="form-control mb-2" placeholder="Username owner" required><input id="op" type="password" class="form-control mb-2" placeholder="Password owner" required><input id="on" class="form-control mb-3" placeholder="Nama owner"><button class="btn btn-success w-100">Bootstrap</button></form><button class="btn btn-link w-100" onclick="login()">Kembali</button></div></div></div></div>';bf.onsubmit=async e=>{e.preventDefault();try{await call('bootstrapOwner',{masterSpreadsheetId:mid.value,username:ou.value,password:op.value,nama:on.value});alert('Bootstrap berhasil. Silakan login.');login()}catch(e){alert(e.message)}}}
function app(){document.body.innerHTML='<div class="row g-0"><aside class="col-lg-2 sidebar p-3"><h4>SATRIA Builder</h4><div id="nav" class="mt-3"></div><button class="btn btn-outline-light w-100 mt-4" onclick="logout()">Keluar</button></aside><main class="col-lg-10"><div class="hero p-4"><h3 class="m-0">Halo, '+esc(S.user.nama||S.user.username)+'</h3><small>'+esc(S.user.role)+'</small></div><div id="content" class="p-4"></div></main></div>';nav.innerHTML='<button class="navbtn" onclick="dashboard()">Dashboard</button>'+(S.user.role==='owner'?'<button class="navbtn" onclick="master(\'MASTER_USERS\')">Master Users</button><button class="navbtn" onclick="master(\'MASTER_GURU\')">Master Guru</button><button class="navbtn" onclick="master(\'MASTER_KARYAWAN\')">Master Karyawan</button><button class="navbtn" onclick="master(\'MASTER_KELAS\')">Master Kelas</button><button class="navbtn" onclick="master(\'MASTER_MAPEL\')">Master Mapel</button><button class="navbtn" onclick="master(\'MASTER_MENU\')">Menu Builder</button><button class="navbtn" onclick="master(\'MASTER_MODUL\')">Modul Kegiatan</button><button class="navbtn" onclick="aggregate()">Akumulasi Kelas</button>':'<button class="navbtn" onclick="classBuilder()">Kelas Saya</button><button class="navbtn" onclick="students()">Siswa</button><button class="navbtn" onclick="modules()">Modul</button>');dashboard()}
async function logout(){try{await call('logout',S.token)}finally{sessionStorage.removeItem('sbv2_token');location.reload()}}
async function dashboard(){const d=await call('api',S.token,'dashboard',{});content.innerHTML='<div class="row g-3"><div class="col-md-4"><div class="card p-4"><span class="text-muted">Role</span><h3>'+esc(d.role)+'</h3></div></div><div class="col-md-4"><div class="card p-4"><span class="text-muted">Kelas</span><h3>'+esc(d.classes??d.className??'-')+'</h3></div></div><div class="col-md-4"><div class="card p-4"><span class="text-muted">Spreadsheet</span><div class="small">'+esc(d.spreadsheetId||'MASTER')+'</div></div></div></div>'}
const F={MASTER_USERS:['username','nama','role','nip_nisn','id_kelas','status','password'],MASTER_GURU:['nip','nama','email','status'],MASTER_KARYAWAN:['nip','nama','email','status'],MASTER_KELAS:['kode_kelas','nama_kelas','spreadsheet_id','admin_username','status'],MASTER_MAPEL:['kode_mapel','nama_mapel','kelompok','status'],MASTER_MENU:['nama_menu','judul','icon','sort_order','roles','module_id','sheet_name','description','status'],MASTER_MODUL:['kode_modul','nama_kegiatan','description','sheet_name','headers_json','roles','status']};
async function master(t){const d=await call('api',S.token,'masters',{table:t});content.innerHTML='<div class="d-flex justify-content-between mb-3"><h4>'+t+'</h4><button class="btn btn-success" onclick="editMaster(\''+t+'\',{})">Tambah</button></div><div class="card p-3"><div class="table-responsive"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(r[h])+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary me-1" onclick=editMaster('+JSON.stringify(t)+','+JSON.stringify(r)+')>Edit</button><button class="btn btn-sm btn-outline-danger" onclick=delMaster('+JSON.stringify(t)+','+JSON.stringify(r[d.headers[0]])+')>Hapus</button></td></tr>').join('')+'</tbody></table></div></div>'}
function editMaster(t,row){const fields=F[t]||[];content.innerHTML='<div class="card p-4"><h4>Form '+t+'</h4>'+fields.map(k=>'<label class="small text-muted">'+k+'</label><input id="f_'+k+'" class="form-control mb-2" value="'+esc(row[k]||'')+'">').join('')+'<p class="small text-muted">Password akan di-hash SHA-256 server-side; plaintext tidak disimpan.</p><button class="btn btn-success" onclick="saveMaster(\''+t+'\', '+JSON.stringify(row)+')">Simpan</button></div>'}
async function saveMaster(t,row){const o={...row};(F[t]||[]).forEach(k=>o[k]=$('f_'+k).value);try{await call('api',S.token,'masterSave',{table:t,item:o});master(t)}catch(e){alert(e.message)}}async function delMaster(t,id){if(!confirm('Hapus data?'))return;try{await call('api',S.token,'masterDelete',{table:t,id});master(t)}catch(e){alert(e.message)}}
async function classBuilder(){const d=await call('api',S.token,'classConfig',{classId:S.user.id_kelas});content.innerHTML='<div class="card p-4"><h4>'+esc(d.class.nama_kelas)+'</h4><div class="small text-muted mb-3">Spreadsheet ID: '+esc(d.class.spreadsheet_id)+'</div><div class="input-group mb-3"><input id="sn" class="form-control" placeholder="Nama sheet, contoh TRX_7KAIH"><button class="btn btn-success" onclick="newSheet()">Tambah Sheet</button></div><div class="list-group">'+d.sheets.map(n=>'<button class="list-group-item list-group-item-action" onclick="sheet(\''+esc(n).replace(/'/g,'\\\'')+'\')">'+esc(n)+'</button>').join('')+'</div></div>'}
async function newSheet(){const n=sn.value.trim();if(!n)return;try{await call('api',S.token,'createSheet',{classId:S.user.id_kelas,sheetName:n,headers:['timestamp']});classBuilder()}catch(e){alert(e.message)}}
async function sheet(n){const c=await call('api',S.token,'classConfig',{classId:S.user.id_kelas});const h=await call('api',S.token,'sheetHeaders',{spreadsheetId:c.class.spreadsheet_id,sheetName:n});content.innerHTML='<div class="card p-4"><h4>'+esc(n)+'</h4><p class="small text-muted">Tulis header satu per baris. Header baru akan ditambahkan tanpa menghapus data lama.</p><textarea id="hh" class="form-control" rows="10">'+esc(h.headers.join('\n'))+'</textarea><button class="btn btn-success mt-3" onclick="saveCols('+JSON.stringify(c.class.spreadsheet_id)+','+JSON.stringify(n)+')">Simpan / Tambah Kolom</button></div>'}
async function saveCols(ssid,n){const a=hh.value.split(/\n/).map(x=>x.trim()).filter(Boolean);try{await call('api',S.token,'addColumns',{spreadsheetId:ssid,sheetName:n,headers:a});sheet(n)}catch(e){alert(e.message)}}
async function modules(){const d=await call('api',S.token,'moduleList',{});content.innerHTML='<div class="row g-3">'+d.rows.map(r=>'<div class="col-md-6"><div class="card p-4"><h5>'+esc(r.nama_kegiatan)+'</h5><p>'+esc(r.description)+'</p><div class="small"><b>Sheet:</b> '+esc(r.sheet_name)+'</div><div class="small mt-2">Header: '+esc(r.headers_json)+'</div>'+(S.user.role==='admin_kelas'?'<button class="btn btn-success btn-sm mt-3" onclick="activate('+JSON.stringify(r.id_modul)+')">Aktifkan</button>':'')+'</div></div>').join('')+'</div>'}async function activate(id){try{await call('api',S.token,'activateModule',{classId:S.user.id_kelas,moduleId:id});alert('Modul aktif setelah sheet tersedia.')}catch(e){alert(e.message)}}
async function students(){const d=await call('api',S.token,'readClassTable',{classId:S.user.id_kelas,sheetName:'SISWA'}).catch(async()=>{return{headers:[],rows:[]}});content.innerHTML='<div class="card p-4"><h4>Siswa</h4><p class="small text-muted">CRUD siswa hanya berada pada spreadsheet kelas masing-masing.</p><button class="btn btn-success mb-3" onclick="addStudent()">Tambah Siswa</button><div class="table-responsive"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(r[h])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}function addStudent(){const username=prompt('Username siswa');if(!username)return;const password=prompt('Password siswa');const nisn=prompt('NISN');const nama=prompt('Nama siswa');call('api',S.token,'userSave',{item:{username,password,nisn,nama,id_kelas:S.user.id_kelas}}).then(students).catch(e=>alert(e.message))}
async function aggregate(){const d=await call('api',S.token,'classAggregate',{});content.innerHTML='<div class="card p-4"><h4>Akumulasi Spreadsheet Kelas</h4><div class="table-responsive"><table class="table"><thead><tr><th>Kelas</th><th>Spreadsheet ID</th><th>Sheet</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.nama_kelas)+'</td><td>'+esc(x.spreadsheet_id||x.error||'')+'</td><td>'+esc((x.sheets||[]).map(s=>s.name).join(', '))+'</td></tr>').join('')+'</tbody></table></div></div>'}
boot();</script></body></html>
