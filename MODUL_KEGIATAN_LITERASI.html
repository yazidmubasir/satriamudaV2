<script>
window.showModulKegiatanLiterasi=async function(){content.innerHTML='<div class="card p-4"><div class="d-flex justify-content-between align-items-center"><div><h3 class="mb-1">MODUL KEGIATAN LITERASI</h3><div class="small-help">Data tersimpan pada TRX_LITERASI sesuai kelas aktif.</div></div><div class="spinner-border text-success"></div></div><div id="modLitBody" class="mt-3"></div></div>';try{const d=await mlitCall('get',{});window.modLitData=d;renderModLit(d);}catch(e){content.innerHTML='<div class="alert alert-danger">'+esc(e.message||e)+'</div>'}};
function mlitCall(a,p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))('getModulKegiatanLiterasi',state.token,a,p||{}));}
function renderModLit(d){const r=state.user.role,opts=(d.classes||[]).map(c=>'<option value="'+esc(c.id_kelas)+'">'+esc(c.kode_kelas+' — '+c.nama_kelas)+'</option>').join(''),cls=(r==='owner'||r==='guru')?'<select id="modLitClass" class="form-select" onchange="reloadModLit()">'+opts+'</select>':'<input class="form-control" value="'+esc(d.class.kode_kelas+' — '+d.class.nama_kelas)+'" readonly>';let top='';if(!d.sheetExists&&d.canCreateSheet)top+='<button class="btn btn-outline-success me-2" onclick="createModLitSheet()">Buat Sheet</button>';if(d.sheetExists&&!d.enabled&&d.canActivate)top+='<button class="btn btn-success" onclick="activateModLit()">Aktifkan Modul</button>';if(d.sheetExists&&d.enabled)top+='<button class="btn btn-success" onclick="editModLit()">Tambah Data</button>';let warning=!d.sheetExists?'<div class="alert alert-warning mt-3">Sheet <b>'+esc(d.module.sheet)+'</b> belum dibuat.</div>':(!d.enabled?'<div class="alert alert-warning mt-3">Modul belum diaktifkan untuk kelas ini.</div>':'');let table=d.sheetExists&&d.enabled?'<div class="table-responsive mt-3"><table class="table table-sm align-middle"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(x=>'<tr>'+d.headers.map(h=>'<td>'+esc(x[h]??'')+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary me-1" onclick=editModLit('+JSON.stringify(x).replaceAll('"','&quot;')+')>Edit</button><button class="btn btn-sm btn-outline-danger" onclick="deleteModLit('+x.__row+')">Hapus</button></td></tr>').join('')+'</tbody></table></div>':'';$('modLitBody').innerHTML='<div class="row g-3"><div class="col-md-5"><label class="form-label">Kelas</label>'+cls+'</div><div class="col-md-7 d-flex align-items-end">'+top+'</div></div>'+warning+table;if((r==='owner'||r==='guru')&&$('modLitClass'))$('modLitClass').value=d.class.id_kelas;}
window.reloadModLit=async function(){const d=await mlitCall('get',{classId:$('modLitClass').value});window.modLitData=d;renderModLit(d)};
window.createModLitSheet=async function(){try{await mlitCall('createSheet',{classId:modLitData.class.id_kelas});showModulKegiatanLiterasi()}catch(e){alert(e.message||e)}};
window.activateModLit=async function(){try{await mlitCall('activate',{classId:modLitData.class.id_kelas});showModulKegiatanLiterasi()}catch(e){alert(e.message||e)}};
window.editModLit=function(row={}){const d=modLitData,htmlFields=d.headers.filter(h=>!['kelas','created_at'].includes(h)).map(h=>{if(h==='siswa_id')return '<label class="form-label">Siswa</label><select id="f_lit_siswa_id" class="form-select mb-2">'+(d.students||[]).map(s=>'<option value="'+esc(s.id_siswa)+'" data-nama="'+esc(s.nama)+'">'+esc(s.nisn+' — '+s.nama)+'</option>').join('')+'</select>';if(h==='nama_siswa')return '';const ta=/ringkasan|refleksi|bukti_fisik/i.test(h);const type=/tanggal/i.test(h)?'date':'text';return '<label class="form-label">'+esc(h)+'</label><'+(ta?'textarea':'input')+' '+(ta?'rows="3"':'type="'+type+'"')+' id="f_lit_'+esc(h)+'" class="form-control mb-2">'+(ta?esc(row[h]||''):'')+'</'+(ta?'textarea':'input')+'>';}).join('');openBuilderModal('<div class="modal fade" id="builderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">'+(row.__row?'Edit':'Tambah')+' Literasi</h5><button class="btn-close btn-close-white" onclick="closeBuilderModal()"></button></div><div class="modal-body">'+htmlFields+'</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeBuilderModal()">Batal</button><button class="btn btn-success" onclick="saveModLit('+Number(row.__row||0)+')">Simpan</button></div></div></div></div>');if($('f_lit_siswa_id'))$('f_lit_siswa_id').value=row.siswa_id||d.students?.[0]?.id_siswa||'';d.headers.forEach(h=>{const el=$('f_lit_'+h);if(el&&!['siswa_id','nama_siswa'].includes(h))el.value=row[h]||'';});};
window.saveModLit=async function(rn){const d=modLitData,row={};d.headers.forEach(h=>{const el=$('f_lit_'+h);if(el)row[h]=el.value});if($('f_lit_siswa_id')){row.siswa_id=$('f_lit_siswa_id').value;row.nama_siswa=$('f_lit_siswa_id').selectedOptions[0]?.dataset.nama||'';}try{await mlitCall('save',{classId:d.class.id_kelas,rowNumber:rn,row});closeBuilderModal();showModulKegiatanLiterasi()}catch(e){alert(e.message||e)}};
window.deleteModLit=async function(n){if(!confirm('Hapus data literasi?'))return;try{await mlitCall('delete',{classId:modLitData.class.id_kelas,rowNumber:n});showModulKegiatanLiterasi()}catch(e){alert(e.message||e)}};
