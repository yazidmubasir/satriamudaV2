<script>
(function(){
  function call(a,p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))('getMBelajarMandiri',state.token,a,p||{}));}
  window.showMBelajarMandiri=async function(){content.innerHTML='<div class="card p-4"><div class="d-flex justify-content-between"><div><h3 class="mb-1">MODUL BELAJAR MANDIRI</h3><div class="small-help">Kelas dan Spreadsheet dibaca dari MASTER_KELAS.</div></div><div class="spinner-border text-success"></div></div><div id="mbbody" class="mt-3"></div></div>';try{const d=await call('get',{});window.mbdata=d;render(d);}catch(e){content.innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>';}};
  function render(d){const r=state.user.role,opts=(d.classes||[]).map(c=>'<option value="'+esc(c.id_kelas)+'">'+esc((c.kode_kelas||'')+' — '+c.nama_kelas)+'</option>').join(''),kelas=(r==='owner'||r==='guru')?'<select id="mbclass" class="form-select" onchange="reloadMBelajarMandiri()">'+opts+'</select>':'<input class="form-control" readonly value="'+esc((d.class.kode_kelas||'')+' — '+d.class.nama_kelas)+'">';let b='';if(!d.sheetExists&&d.canCreateSheet)b+='<button class="btn btn-outline-success me-2" onclick="createMBelajarSheet()">Buat Sheet</button>';if(d.sheetExists&&!d.enabled&&d.canActivate)b+='<button class="btn btn-success" onclick="activateMBelajar()">Aktifkan Modul</button>';if(d.sheetExists&&d.enabled&&d.canWrite)b+='<button class="btn btn-success" onclick="editMBelajar()">Tambah Data</button>';const warn=!d.sheetExists?'<div class="alert alert-warning mt-3">Sheet <b>'+esc(d.module.sheet)+'</b> belum dibuat.</div>':(!d.enabled?'<div class="alert alert-warning mt-3">Modul belum diaktifkan pada kelas ini.</div>':'');const table=d.sheetExists&&d.enabled?'<div class="table-responsive mt-3"><table class="table table-sm"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(x=>'<tr>'+d.headers.map(h=>'<td>'+esc(x[h]??'')+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary me-1" onclick=editMBelajar('+JSON.stringify(x).replaceAll('"','&quot;')+')>Edit</button><button class="btn btn-sm btn-outline-danger" onclick="deleteMBelajar('+x.__row+')">Hapus</button></td></tr>').join('')+'</tbody></table></div>':'';$('mbbody').innerHTML='<div class="row g-3"><div class="col-md-5"><label class="form-label">Kelas</label>'+kelas+'</div><div class="col-md-7 d-flex align-items-end">'+b+'</div></div>'+warn+table;if((r==='owner'||r==='guru')&&$('mbclass'))$('mbclass').value=d.class.id_kelas;}
  window.reloadMBelajarMandiri=async function(){const d=await call('get',{classId:$('mbclass').value});window.mbdata=d;render(d);};
  window.createMBelajarSheet=async function(){try{await call('createSheet',{classId:mbdata.class.id_kelas});showMBelajarMandiri();}catch(e){alert(e.message)}};
  window.activateMBelajar=async function(){try{await call('activate',{classId:mbdata.class.id_kelas});showMBelajarMandiri();}catch(e){alert(e.message)}};
  window.editMBelajar=function(row={}){const d=mbdata,fields=d.headers.filter(h=>!['kelas','created_at','nama_siswa'].includes(h)).map(h=>{if(h==='siswa_id')return '<label class="form-label">Siswa</label><select id="mb_siswa_id" class="form-select mb-2">'+(d.students||[]).map(s=>'<option value="'+esc(s.id_siswa)+'" data-nama="'+esc(s.nama)+'">'+esc((s.nisn||'')+' — '+s.nama)+'</option>').join('')+'</select>';const ta=/materi|aktivitas|hasil_belajar|refleksi|bukti_fisik/i.test(h),type=/tanggal/i.test(h)?'date':'text';return '<label class="form-label">'+esc(h)+'</label><'+(ta?'textarea':'input')+' '+(ta?'rows="3"':'type="'+type+'"')+' id="mb_'+esc(h)+'" class="form-control mb-2">'+(ta?esc(row[h]||''):'')+'</'+(ta?'textarea':'input')+'>';}).join('');openBuilderModal('<div class="modal fade" id="builderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">'+(row.__row?'Edit':'Tambah')+' Belajar Mandiri</h5><button class="btn-close btn-close-white" onclick="closeBuilderModal()"></button></div><div class="modal-body">'+fields+'</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeBuilderModal()">Batal</button><button class="btn btn-success" onclick="saveMBelajar('+Number(row.__row||0)+')">Simpan</button></div></div></div></div>');if($('mb_siswa_id'))$('mb_siswa_id').value=row.siswa_id||d.students?.[0]?.id_siswa||'';d.headers.forEach(h=>{const el=$('mb_'+h);if(el&&!['siswa_id','nama_siswa'].includes(h))el.value=row[h]||'';});};
  window.saveMBelajar=async function(n){const d=mbdata,row={};d.headers.forEach(h=>{const el=$('mb_'+h);if(el)row[h]=el.value;});if($('mb_siswa_id')){row.siswa_id=$('mb_siswa_id').value;row.nama_siswa=$('mb_siswa_id').selectedOptions[0]?.dataset.nama||'';}try{await call('save',{classId:d.class.id_kelas,rowNumber:n,row});closeBuilderModal();showMBelajarMandiri();}catch(e){alert(e.message)}};
  window.deleteMBelajar=async function(n){if(!confirm('Hapus data belajar mandiri?'))return;try{await call('delete',{classId:mbdata.class.id_kelas,rowNumber:n});showMBelajarMandiri();}catch(e){alert(e.message)}};
})();
</script>
