<script>
(function(){
  const prefix='mod7';
  window.showModul7KAIH=async function(){
    content.innerHTML='<div class="card p-4"><div class="d-flex justify-content-between align-items-center"><div><h3 class="mb-1">MODUL 7KAIH</h3><div class="small-help">Kelas dan Spreadsheet dibaca otomatis dari MASTER_KELAS.</div></div><div class="spinner-border text-success" id="mod7Load"></div></div><div id="mod7Body" class="mt-3"></div></div>';
    try{const d=await new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))( 'getModul7Kaih',state.token,'get',{}));window.mod7Data=d;renderMod7(d);}catch(e){content.innerHTML='<div class="alert alert-danger">'+esc(e.message||e)+'</div>';}
  };
  function call(action,p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))('getModul7Kaih',state.token,action,p||{}));}
  function renderMod7(d){
    const role=state.user.role, classOptions=(d.classes||[]).map(c=>'<option value="'+esc(c.id_kelas)+'">'+esc(c.kode_kelas+' — '+c.nama_kelas)+'</option>').join('');
    let status=''; if(!d.sheetExists)status='<div class="alert alert-warning">Sheet <b>'+esc(d.module.sheet)+'</b> belum dibuat pada kelas ini.</div>'; else if(!d.enabled)status='<div class="alert alert-warning">Modul belum diaktifkan pada kelas ini.</div>';
    const select=(role==='owner'||role==='guru')?'<select id="mod7Class" class="form-select" onchange="reloadMod7()">'+classOptions+'</select>':'<input class="form-control" value="'+esc(d.class.kode_kelas+' — '+d.class.nama_kelas)+'" readonly>';
    let buttons=''; if(!d.sheetExists&&d.canCreateSheet)buttons+='<button class="btn btn-outline-success me-2" onclick="createMod7Sheet()">Buat Sheet</button>'; if(d.sheetExists&&!d.enabled&&d.canActivate)buttons+='<button class="btn btn-success" onclick="activateMod7()">Aktifkan Modul</button>'; if(d.sheetExists&&d.enabled&&['owner','admin_kelas','guru','siswa'].includes(role))buttons+='<button class="btn btn-success" onclick="editMod7()">Tambah Data</button>';
    const table=d.sheetExists&&d.enabled?'<div class="table-responsive mt-3"><table class="table table-sm align-middle"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.headers.map(h=>'<td>'+esc(r[h]??'')+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary me-1" onclick=editMod7('+JSON.stringify(r).replaceAll('"','&quot;')+')>Edit</button><button class="btn btn-sm btn-outline-danger" onclick="deleteMod7('+r.__row+')">Hapus</button></td></tr>').join('')+'</tbody></table></div>':'';
    $('mod7Body').innerHTML='<div class="row g-3"><div class="col-md-5"><label class="form-label">Kelas</label>'+select+'</div><div class="col-md-7 d-flex align-items-end">'+buttons+'</div></div>'+status+table; if((role==='owner'||role==='guru')&&$('mod7Class'))$('mod7Class').value=d.class.id_kelas;
  }
  window.reloadMod7=async function(){const id=$('mod7Class')?.value||'';const d=await call('get',{classId:id});window.mod7Data=d;renderMod7(d);};
  window.createMod7Sheet=async function(){try{await call('createSheet',{classId:window.mod7Data.class.id_kelas});showModul7KAIH();}catch(e){alert(e.message||e)}};
  window.activateMod7=async function(){try{await call('activate',{classId:window.mod7Data.class.id_kelas});showModul7KAIH();}catch(e){alert(e.message||e)}};
  window.editMod7=function(row={}){const d=window.mod7Data,editable=d.headers.filter(h=>!['kelas','created_at'].includes(h));const fields=editable.map(h=>{const type=/tanggal/i.test(h)?'date':/uraian|catatan|bukti|refleksi|hasil|ringkasan/i.test(h)?'textarea':'text';if(h==='siswa_id'){return '<label class="form-label">Siswa</label><select id="f_mod7_siswa_id" class="form-select mb-2">'+(d.students||[]).map(s=>'<option value="'+esc(s.id_siswa)+'" data-nama="'+esc(s.nama)+'">'+esc(s.nisn+' — '+s.nama)+'</option>').join('')+'</select>';}if(h==='nama_siswa')return '<div class="small-help">Nama siswa mengikuti pilihan siswa.</div>';let value=row[h]||'';return '<label class="form-label">'+esc(h)+'</label><'+(type==='textarea'?'textarea':'input')+' '+(type==='textarea'?'rows="3"':'type="'+type+'"')+' id="f_mod7_'+esc(h)+'" class="form-control mb-2">'+(type==='textarea'?esc(value):'')+'</'+(type==='textarea'?'textarea':'input')+'>';}).join('');const html='<div class="modal fade" id="builderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">'+(row.__row?'Edit':'Tambah')+' 7KAIH</h5><button class="btn-close btn-close-white" onclick="closeBuilderModal()"></button></div><div class="modal-body">'+fields+'</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeBuilderModal()">Batal</button><button class="btn btn-success" onclick="saveMod7('+Number(row.__row||0)+')">Simpan</button></div></div></div></div>';window._mod7edit=row;openBuilderModal(html);if($('f_mod7_siswa_id'))$('f_mod7_siswa_id').value=row.siswa_id||d.students?.[0]?.id_siswa||'';};
  window.saveMod7=async function(rn){const d=window.mod7Data,row={};d.headers.forEach(h=>{if(h==='kelas'||h==='created_at')return;const el=$('f_mod7_'+h);if(el)row[h]=el.value;});if($('f_mod7_siswa_id')){row.siswa_id=$('f_mod7_siswa_id').value;const opt=$('f_mod7_siswa_id').selectedOptions[0];row.nama_siswa=opt?.dataset.nama||'';}try{await call('save',{classId:d.class.id_kelas,rowNumber:rn,row});closeBuilderModal();showModul7KAIH();}catch(e){alert(e.message||e)}};
  window.deleteMod7=async function(rn){if(!confirm('Hapus data 7KAIH?'))return;try{await call('delete',{classId:window.mod7Data.class.id_kelas,rowNumber:rn});showModul7KAIH();}catch(e){alert(e.message||e)}};
  const oldLoadModules=window.loadModules; window.loadModules=function(){content.innerHTML='<div class="row g-3"><div class="col-md-4"><div class="card p-4"><h5>MODUL 7KAIH</h5><p>Kegiatan pembiasaan dan penguatan karakter 7KAIH.</p><button class="btn btn-success" onclick="showModul7KAIH()">Buka Modul</button></div></div><div class="col-md-4"><div class="card p-4"><h5>MODUL BELAJAR MANDIRI</h5><p>Kegiatan belajar mandiri siswa per kelas.</p><button class="btn btn-success" onclick="showModulBelajarMandiri()">Buka Modul</button></div></div><div class="col-md-4"><div class="card p-4"><h5>MODUL KEGIATAN LITERASI</h5><p>Pencatatan kegiatan literasi siswa.</p><button class="btn btn-success" onclick="showModulKegiatanLiterasi()">Buka Modul</button></div></div></div>';};
})();
</script>
