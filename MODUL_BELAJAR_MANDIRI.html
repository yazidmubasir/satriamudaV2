<script>
window.showModulBelajarMandiri=async function(){content.innerHTML='<div class="card p-4"><div class="d-flex justify-content-between align-items-center"><div><h3 class="mb-1">MODUL BELAJAR MANDIRI</h3><div class="small-help">Data tersimpan pada TRX_BELAJAR_MANDIRI sesuai kelas aktif.</div></div><div class="spinner-border text-success"></div></div><div id="modBmBody" class="mt-3"></div></div>';try{const d=await mbmCall('get',{});window.modBmData=d;renderModBm(d);}catch(e){content.innerHTML='<div class="alert alert-danger">'+esc(e.message||e)+'</div>'}};
function mbmCall(a,p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))('getModulBelajarMandiri',state.token,a,p||{}));}
function renderModBm(d){const r=state.user.role,opts=(d.classes||[]).map(c=>'<option value="'+esc(c.id_kelas)+'">'+esc(c.kode_kelas+' — '+c.nama_kelas)+'</option>').join(''),cls=(r==='owner'||r==='guru')?'<select id="modBmClass" class="form-select" onchange="reloadModBm()">'+opts+'</select>':'<input class="form-control" value="'+esc(d.class.kode_kelas+' — '+d.class.nama_kelas)+'" readonly>';let top='';if(!d.sheetExists&&d.canCreateSheet)top+='<button class="btn btn-outline-success me-2" onclick="createModBmSheet()">Buat Sheet</button>';if(d.sheetExists&&!d.enabled&&d.canActivate)top+='<button class="btn btn-success" onclick="activateModBm()">Aktifkan Modul</button>';if(d.sheetExists&&d.enabled)top+='<button class="btn btn-success" onclick="editModBm()">Tambah Data</button>';let warning=!d.sheetExists?'<div class="alert alert-warning mt-3">Sheet <b>'+esc(d.module.sheet)+'</b> belum dibuat.</div>':(!d.enabled?'<div class="alert alert-warning mt-3">Modul belum diaktifkan untuk kelas ini.</div>':'');let table=d.sheetExists&&d.enabled?'<div class="table-responsive mt-3"><table class="table table-sm align-middle"><thead><tr>'+d.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Aksi</th></tr></thead><tbody>'+d.rows.map(x=>'<tr>'+d.headers.map(h=>'<td>'+esc(x[h]??'')+'</td>').join('')+'<td><button class="btn btn-sm btn-outline-secondary me-1" onclick=editModBm('+JSON.stringify(x).replaceAll('"','&quot;')+')>Edit</button><button class="btn btn-sm btn-outline-danger" onclick="deleteModBm('+x.__row+')">Hapus</button></td></tr>').join('')+'</tbody></table></div>':'';$('modBmBody').innerHTML='<div class="row g-3"><div class="col-md-5"><label class="form-label">Kelas</label>'+cls+'</div><div class="col-md-7 d-flex align-items-end">'+top+'</div></div>'+warning+table;if((r==='owner'||r==='guru')&&$('modBmClass'))$('modBmClass').value=d.class.id_kelas;}
window.reloadModBm=async function(){const d=await mbmCall('get',{classId:$('modBmClass').value});window.modBmData=d;renderModBm(d)};
window.createModBmSheet=async function(){try{await mbmCall('createSheet',{classId:modBmData.class.id_kelas});showModulBelajarMandiri()}catch(e){alert(e.message||e)}};
window.activateModBm=async function(){try{await mbmCall('activate',{classId:modBmData.class.id_kelas});showModulBelajarMandiri()}catch(e){alert(e.message||e)}};
window.editModBm=function(row={}){const d=modBmData,htmlFields=d.headers.filter(h=>!['kelas','created_at'].includes(h)).map(h=>{if(h==='siswa_id')return '<label class="form-label">Siswa</label><select id="f_bm_siswa_id" class="form-select mb-2">'+(d.students||[]).map(s=>'<option value="'+esc(s.id_siswa)+'" data-nama="'+esc(s.nama)+'">'+esc(s.nisn+' — '+s.nama)+'</option>').join('')+'</select>';if(h==='nama_siswa')return '';const ta=/materi|aktivitas|hasil_belajar|refleksi|bukti_fisik/i.test(h);const type=/tanggal/i.test(h)?'date':'text';return '<label class="form-label">'+esc(h)+'</label><'+(ta?'textarea':'input')+' '+(ta?'rows="3"':'type="'+type+'"')+' id="f_bm_'+esc(h)+'" class="form-control mb-2">'+(ta?esc(row[h]||''):'')+'</'+(ta?'textarea':'input')+'>';}).join('');openBuilderModal('<div class="modal fade" id="builderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">'+(row.__row?'Edit':'Tambah')+' Belajar Mandiri</h5><button class="btn-close btn-close-white" onclick="closeBuilderModal()"></button></div><div class="modal-body">'+htmlFields+'</div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeBuilderModal()">Batal</button><button class="btn btn-success" onclick="saveModBm('+Number(row.__row||0)+')">Simpan</button></div></div></div></div>');if($('f_bm_siswa_id'))$('f_bm_siswa_id').value=row.siswa_id||d.students?.[0]?.id_siswa||'';d.headers.forEach(h=>{const el=$('f_bm_'+h);if(el&&!['siswa_id','nama_siswa'].includes(h))el.value=row[h]||'';});};
window.saveModBm=async function(rn){const d=modBmData,row={};d.headers.forEach(h=>{const el=$('f_bm_'+h);if(el)row[h]=el.value});if($('f_bm_siswa_id')){row.siswa_id=$('f_bm_siswa_id').value;row.nama_siswa=$('f_bm_siswa_id').selectedOptions[0]?.dataset.nama||'';}try{await mbmCall('save',{classId:d.class.id_kelas,rowNumber:rn,row});closeBuilderModal();showModulBelajarMandiri()}catch(e){alert(e.message||e)}};
window.deleteModBm=async function(n){if(!confirm('Hapus data belajar mandiri?'))return;try{await mbmCall('delete',{classId:modBmData.class.id_kelas,rowNumber:n});showModulBelajarMandiri()}catch(e){alert(e.message||e)}};
